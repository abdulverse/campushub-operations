<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102a43" />
    <title>CampusHub — Operations Master App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .branch-selector { height: 36px; min-width: 145px; padding: 0 10px; border: 1px solid #d9e3ec; border-radius: 8px; background: #fff; color: #30465a; font: 600 12px 'DM Sans', sans-serif; cursor: pointer; }
      .branch-context { color: #1877d3; font-weight: 600; }
      .role-chip { display: inline-flex; align-items: center; height: 28px; padding: 0 8px; border-radius: 14px; background: #f0ecff; color: #6741d9; font-size: 10px; font-weight: 700; }
      .master-hero { padding: 24px; background: linear-gradient(125deg, #102a43, #1d5b83); color: #fff; overflow: hidden; position: relative; }
      .master-hero:after { content: '✦'; position: absolute; right: 26px; top: -22px; color: #69c9e8; font-size: 150px; opacity: .18; }
      .master-hero h2 { position: relative; z-index: 1; margin: 4px 0 8px; font-size: 25px; letter-spacing: -.5px; }
      .master-hero p { position: relative; z-index: 1; max-width: 520px; margin: 0; color: #b8d7ea; font-size: 13px; }
      .app-grid { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 16px; margin-top: 20px; }
      .app-module { min-height: 205px; padding: 19px; cursor: pointer; transition: .18s; }
      .app-module:hover { transform: translateY(-3px); box-shadow: 0 10px 25px rgba(16,42,67,.11); }
      .app-module .module-icon { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; font-size: 20px; }
      .module-icon.transport { background: #e6f2fc; color: #1877d3; }.module-icon.grievance { background: #fff0e6; color: #c76c00; }.module-icon.tasks { background: #eeeafd; color: #6741d9; }
      .app-module h2 { margin: 15px 0 5px; font-size: 17px; }.app-module p { margin: 0; color: #6d7a88; font-size: 12px; line-height: 1.45; }.app-module footer { display: flex; justify-content: space-between; align-items: center; margin-top: 17px; padding-top: 13px; border-top: 1px solid #e8edf1; color: #1877d3; font-size: 12px; font-weight: 600; }
      .kanban { display: grid; grid-template-columns: repeat(3, minmax(220px, 1fr)); gap: 14px; }.kanban-column { padding: 13px; background: #eef3f7; border-radius: 10px; }.kanban-head { display: flex; justify-content: space-between; margin: 0 0 11px; color: #526273; font-size: 12px; font-weight: 700; }.task-card { padding: 12px; margin-top: 9px; border: 1px solid #e5eaf0; border-radius: 8px; background: #fff; box-shadow: 0 1px 3px rgba(16,42,67,.04); }.task-card h3 { margin: 0 0 6px; font-size: 12px; }.task-card p { margin: 0; color: #788695; font-size: 10px; line-height: 1.4; }.task-card footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }.task-card button { border: 0; background: transparent; color: #1877d3; padding: 0; font: 600 10px 'DM Sans'; cursor: pointer; }
      @media (max-width: 650px) { .branch-selector { min-width: 112px; } }
      @media (max-width: 850px) { .app-grid, .kanban { grid-template-columns: 1fr; } }
      /* Live mode deliberately starts with an authentication gate rather than demo data. */
      .auth-page,.live-state{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(135deg,#eef6fb,#f7f9fc)}
      .auth-card,.live-state-card{width:min(100%,430px);padding:32px;border:1px solid #e4ebf1;border-radius:16px;background:#fff;box-shadow:0 18px 45px #102a4317}
      .auth-brand{display:flex;align-items:center;gap:7px;font-size:21px;color:#102a43}.auth-brand .brand-mark{margin:0}.eyebrow{margin:27px 0 7px;color:#1877d3;font:600 10px 'DM Mono',monospace;letter-spacing:1px}
      .auth-card h1,.live-state-card h1{margin:0;font-size:25px;letter-spacing:-.5px}.auth-card>p:not(.eyebrow),.live-state-card p{color:#687789;font-size:13px;line-height:1.5}
      .auth-form{display:grid;gap:15px;margin-top:23px}.auth-form label{display:grid;gap:6px;color:#506174;font-size:12px;font-weight:600}.auth-form input{height:40px;border:1px solid #dce4eb;border-radius:8px;padding:0 11px;font:14px 'DM Sans';outline:none}.auth-form .button{margin-top:4px;height:42px}.auth-help{margin:20px 0 0!important;font-size:11px!important}
      .live-state-card{text-align:center}.live-state-icon{display:grid;place-items:center;width:45px;height:45px;margin:0 auto 15px;border-radius:12px;background:#eaf4ff;color:#1877d3;font-size:24px}.live-spinner{display:inline-block;width:24px;height:24px;margin:0 auto 16px;border:3px solid #d8e8f5;border-top-color:#1877d3;border-radius:50%;animation:campushub-spin .8s linear infinite}.live-empty{padding:28px;text-align:center;color:#687789}.live-empty h2{margin:0 0 7px;color:#26384a}.live-empty p{margin:0}
      .nav-disabled{opacity:.47;cursor:default}.nav-disabled:hover{background:transparent;color:#c9d9e6}.live-branch-control{display:grid;gap:3px;color:#687789;font-size:10px;font-weight:600}.live-branch-control select{height:35px;min-width:150px;border:1px solid #dce4eb;border-radius:8px;padding:0 8px;background:#fff;color:#314154;font:600 12px 'DM Sans'}
      @keyframes campushub-spin{to{transform:rotate(360deg)}}@media(max-width:650px){.auth-page,.live-state{padding:16px}.auth-card,.live-state-card{padding:25px 21px}.live-branch-control,.live-branch-control select{width:100%}.head-actions{width:100%}}
    </style>
  </head>
  <body>
    <div id="campusHubRoot" aria-live="polite"></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <dialog id="modal"></dialog>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="live-app.js"></script>
  </body>
</html>
